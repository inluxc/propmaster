# Services for Propmaster's integration tests, for local runs and for any CI system.
#
#   docker compose -f compose.test.yaml up -d --wait            # everything
#   docker compose -f compose.test.yaml up -d --wait postgres   # just what you need
#   docker compose -f compose.test.yaml down -v
#
# Ports bind to 127.0.0.1: tests on the host use localhost, tests in a container on the
# propmaster-test_default network use the service names (see docs/ci-docker-compose.md).
name: propmaster-test

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 2s
      retries: 30

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: testdb
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports: ["127.0.0.1:3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 2s
      retries: 60

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TestPass123!"
    ports: ["127.0.0.1:1433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TestPass123!' -C -Q 'SELECT 1'"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  mongodb:
    image: mongo:7
    ports: ["127.0.0.1:27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 2s
      retries: 30

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/testpassword
    ports: ["127.0.0.1:7687:7687"]
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "testpassword", "RETURN 1"]
      interval: 5s
      retries: 30

  # ScyllaDB for cassandraClient: CQL-compatible with Cassandra and ready in
  # seconds. One core and 750 MB in developer mode, enough for tests.
  scylla:
    image: scylladb/scylla:2026.3.6
    command: ["--smp", "1", "--memory", "750M", "--overprovisioned", "1", "--developer-mode", "1"]
    ports: ["127.0.0.1:9042:9042"]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local' > /dev/null"]
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 30

  # ClickHouse for clickHouseClient, over its HTTP interface (8123). No
  # CLICKHOUSE_DB: the tests create their database (PW_CLICKHOUSE_CREATE_DATABASE),
  # and without it the image skips the init server that answers /ping too early.
  clickhouse:
    image: clickhouse/clickhouse-server:26.10
    environment:
      CLICKHOUSE_USER: testuser
      CLICKHOUSE_PASSWORD: testpass
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    ports: ["127.0.0.1:8123:8123"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping > /dev/null"]
      interval: 3s
      timeout: 5s
      retries: 30

  kafka:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners: kafka:19092 for other containers, localhost:9092 for the host.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports: ["127.0.0.1:9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:4
    environment:
      # The image's guest user may only connect from inside the container.
      RABBITMQ_DEFAULT_USER: testuser
      RABBITMQ_DEFAULT_PASS: testpass
    ports: ["127.0.0.1:5672:5672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      retries: 30

  moto:
    # AWS emulator (S3, SQS, SNS, ...). LocalStack's image needs an auth token
    # since 2026; Moto doesn't. Mapped to 4566, LocalStack's port, so either works
    # with PW_AWS_ENDPOINT=http://localhost:4566.
    image: motoserver/moto:5.2.5
    ports: ["127.0.0.1:4566:5000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5000/moto-api/ > /dev/null"]
      interval: 2s
      retries: 15

  elasticsearch:
    # Single node, security off (plain HTTP, no password): PW_SEARCH_URL=http://localhost:9200
    image: elasticsearch:9.5.5
    ports: ["127.0.0.1:9200:9200"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' > /dev/null"]
      interval: 3s
      retries: 40

  opensearch:
    # Same API on 9201: PW_SEARCH_URL=http://localhost:9201
    image: opensearchproject/opensearch:3.10.0
    ports: ["127.0.0.1:9201:9200"]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' > /dev/null"]
      interval: 3s
      retries: 40

  grpcbin:
    # gRPC test server with server reflection: plaintext on 9000 (PW_GRPC_ADDRESS=localhost:9000),
    # TLS with a self-signed certificate on 9001. amd64 only (emulated on Apple silicon)
    image: moul/grpcbin:latest
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000"]
      interval: 2s
      retries: 15

  echo-server:
    # WebSocket echo on any path, SSE on /.sse (PW_REALTIME_URL=http://localhost:8091).
    # The image is a single Go binary with no shell, so there is no health check:
    # it serves as soon as the container runs.
    image: jmalloc/echo-server:v0.3.7
    ports: ["127.0.0.1:8091:8080"]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]   # API/UI, SMTP
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      retries: 15

  wiremock:
    image: wiremock/wiremock:3.13.2
    ports: ["127.0.0.1:8089:8080"]   # stubs and admin API (/__admin)
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/__admin/health > /dev/null"]
      interval: 2s
      retries: 30
