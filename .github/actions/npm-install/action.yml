name: npm install (cached)
description: Restore the npm download cache keyed on package-lock.json, then run npm ci.
inputs:
  ignore-scripts:
    description: Skip install scripts (no native builds such as better-sqlite3).
    default: "false"
runs:
  using: composite
  steps:
    - name: Cache npm downloads
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: npm-${{ runner.os }}-
    - name: npm ci
      shell: bash
      run: npm ci --prefer-offline --no-audit --no-fund ${{ inputs.ignore-scripts == 'true' && '--ignore-scripts' || '' }}
