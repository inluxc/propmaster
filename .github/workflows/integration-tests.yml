    timeout-minutes: 15
    container: node:24
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 30s
          --health-retries 10
    env:
      CI: true
      PW_MONGODB_HOST: mongodb
      PW_MONGODB_PORT: "27017"
      PW_MONGODB_DATABASE: testdb
    steps:
