      CI: true
      PW_DB_TYPE: mysql
      PW_DB_HOST: mysql
      PW_DB_PORT: "3306"
      PW_DB_NAME: testdb
      PW_DB_USERNAME: testuser
      PW_DB_PASSWORD: testpass
