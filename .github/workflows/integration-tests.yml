  test-cassandra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: node:24
    services:
      # ScyllaDB (CQL, like Cassandra). Services take no command, so one core
      # comes from --cpuset-cpus: on every core, Seastar can fail its AIO check.
      scylla:
        image: scylladb/scylla:2026.3.6
        ports:
          - 9042:9042
        options: >-
          --cpuset-cpus 0
          --health-cmd "cqlsh -e 'SELECT now() FROM system.local' > /dev/null"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
    env:
      CI: true
      PW_CASSANDRA_CONTACT_POINTS: scylla
      PW_CASSANDRA_KEYSPACE: propmaster_examples
      PW_CASSANDRA_CREATE_KEYSPACE: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/npm-install
      - uses: ./.github/actions/test-history
      - name: Validate environment variables
        run: bash .github/scripts/validate-env.sh PW_CASSANDRA_CONTACT_POINTS PW_CASSANDRA_KEYSPACE
      - name: Run Cassandra (ScyllaDB) integration tests
        run: npx playwright test --project=integration-cassandra
      - uses: ./.github/actions/test-history
        if: always()
        with:
          save: true
      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-cassandra
          path: playwright-report/
          retention-days: 7
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-cassandra
          path: test-results/
          retention-days: 7

  test-mongodb:
