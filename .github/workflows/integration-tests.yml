          retention-days: 7

  test-search-elasticsearch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: node:24
    services:
      elasticsearch:
        image: elasticsearch:9.5.5
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          cluster.routing.allocation.disk.threshold_enabled: "false"
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        options: >-
          --health-cmd "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' > /dev/null"
          --health-interval 3s
          --health-timeout 10s
          --health-retries 40
    env:
      CI: true
      PW_SEARCH_URL: http://elasticsearch:9200
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/npm-install
      - uses: ./.github/actions/test-history
      - name: Validate environment variables
        run: bash .github/scripts/validate-env.sh PW_SEARCH_URL
      - name: Run search integration tests against Elasticsearch
        run: npx playwright test --project=integration-search
      - uses: ./.github/actions/test-history
        if: always()
        with:
          save: true
      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-search-elasticsearch
          path: playwright-report/
          retention-days: 7
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-search-elasticsearch
          path: test-results/
          retention-days: 7

  test-search-opensearch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: node:24
    services:
      opensearch:
        image: opensearchproject/opensearch:3.10.0
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          cluster.routing.allocation.disk.threshold_enabled: "false"
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        options: >-
          --health-cmd "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' > /dev/null"
          --health-interval 3s
          --health-timeout 10s
          --health-retries 40
    env:
      CI: true
      PW_SEARCH_URL: http://opensearch:9200
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/npm-install
      - uses: ./.github/actions/test-history
      - name: Validate environment variables
        run: bash .github/scripts/validate-env.sh PW_SEARCH_URL
      - name: Run search integration tests against OpenSearch
        run: npx playwright test --project=integration-search
      - uses: ./.github/actions/test-history
        if: always()
        with:
          save: true
      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-search-opensearch
          path: playwright-report/
          retention-days: 7
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-search-opensearch
          path: test-results/
          retention-days: 7

  test-grpc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: node:24
    services:
      grpcbin:
        # gRPC test server with reflection: plaintext on 9000, TLS (self-signed) on 9001
        image: moul/grpcbin:latest
        options: >-
          --health-cmd "nc -z localhost 9000"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      CI: true
      PW_GRPC_ADDRESS: grpcbin:9000
      PW_GRPC_PROTO_FILES: tests/examples/protos/hello.proto
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/npm-install
      - uses: ./.github/actions/test-history
      - name: Validate environment variables
        run: bash .github/scripts/validate-env.sh PW_GRPC_ADDRESS
      - name: Run gRPC tests
        run: npx playwright test --project=grpc
      - uses: ./.github/actions/test-history
        if: always()
        with:
          save: true
      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-grpc
          path: playwright-report/
          retention-days: 7
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-grpc
          path: test-results/
          retention-days: 7

  test-realtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: node:24
    services:
      echo-server:
        # WebSocket echo on any path, SSE on /.sse. The image has no shell, so no
        # --health-cmd: the "Wait for echo-server" step below checks it instead.
        image: jmalloc/echo-server:v0.3.7
    env:
      CI: true
      PW_REALTIME_URL: http://echo-server:8080
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/npm-install
      - uses: ./.github/actions/test-history
      - name: Validate environment variables
        run: bash .github/scripts/validate-env.sh PW_REALTIME_URL
      - name: Wait for echo-server
        run: node -e "const t=Date.now();(async()=>{for(;;){try{await fetch(process.env.PW_REALTIME_URL);return}catch{if(Date.now()-t>30000)throw new Error('echo-server is not up');await new Promise(r=>setTimeout(r,500))}}})()"
      - name: Run realtime (WebSocket / SSE) tests
        run: npx playwright test --project=realtime
      - uses: ./.github/actions/test-history
        if: always()
        with:
          save: true
      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-realtime
          path: playwright-report/
          retention-days: 7
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-realtime
          path: test-results/
          retention-days: 7

  test-openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: node:24
    env:
      CI: true
      # A local file, so CI covers the local-path loader (URLs are covered by unit tests).
      PW_OPENAPI_SPEC_PATH: /tmp/petstore-spec.json
      PW_OPENAPI_BASE_URL: http://localhost:4010
      # Every response is checked against the spec (contract checks).
      PW_OPENAPI_VALIDATE_RESPONSES: true
      PW_OPENAPI_VALIDATE_REQUESTS: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/npm-install
      - uses: ./.github/actions/test-history
      - name: Download OpenAPI spec locally
        run: curl -s https://petstore.swagger.io/v2/swagger.json -o /tmp/petstore-spec.json
      # Prism logs every request. Its output goes to a file: this step's own
      # output pipe closes when the step ends, and a background Prism still
      # writing to it dies partway through the later test steps.
      - name: Start Prism mock server
        run: |
          nohup npx prism mock /tmp/petstore-spec.json --port 4010 --host 0.0.0.0 --errors false > /tmp/prism.log 2>&1 &
          echo "Prism PID: $!"
      - name: Wait for mock server
        run: |
          for i in $(seq 1 60); do
            if bash -c 'echo > /dev/tcp/localhost/4010' 2>/dev/null; then
              echo "Mock server is ready (port 4010 open)"
              sleep 2
              exit 0
            fi
            echo "Waiting for mock server... ($i/60)"
            sleep 2
          done
          echo "Mock server failed to start within 120 seconds"
          exit 1
      - name: Run OpenAPI integration tests
        run: npx playwright test --project=openapi
      # `propmaster generate openapi` must write tests that pass the checker,
      # typecheck and pass against the mock. --prism makes every documented
      # status code runnable (Prism answers Prefer: code=<status>).
      - name: Generate API tests from the spec
        run: npx tsx src/cli/init.ts generate openapi --spec /tmp/petstore-spec.json --out tests/generated --import ../../src --prism
      - name: Check and typecheck the generated tests
        run: npm run lint:tests && npm run typecheck
      - name: Run the generated tests against Prism
        run: npx playwright test --project=openapi-generated
      - uses: ./.github/actions/test-history
        if: always()
        with:
          save: true
      - name: Show the Prism log
        if: failure()
        run: tail -n 200 /tmp/prism.log || true
      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-openapi
          path: playwright-report/
          retention-days: 7
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-openapi
          path: test-results/
          retention-days: 7

  # Same suites with no services: blocks. Each backend starts in a container from
  # the test run itself (PW_<BACKEND>_CONTAINER=true), as it would on a laptop.
  test-testcontainers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: postgresql
            projects: --project=api-integration --project=integration-inbox --project=integration-mocks   # every backend at once
            password: testpass
          - db: mysql
            projects: --project=integration-database
            password: testpass
          - db: mssql
            projects: --project=integration-database
            password: "TestPass123!"
    name: test-testcontainers (${{ matrix.db }})
    env:
      CI: true
      PW_DB_TYPE: ${{ matrix.db }}
      PW_DB_PASSWORD: ${{ matrix.password }}
      PW_DB_CONTAINER: "true"
      PW_DB_CONTAINER_INIT: tests/examples/sql/users.${{ matrix.db }}.sql
      PW_REDIS_CONTAINER: "true"
      PW_REDIS_KEY_PREFIX: "test:ci-${{ github.run_id }}:"
      PW_MONGODB_CONTAINER: "true"
      PW_NEO4J_CONTAINER: "true"
      PW_CASSANDRA_CONTAINER: "true"
      PW_CASSANDRA_KEYSPACE: propmaster_examples
      PW_KAFKA_CONTAINER: "true"
      PW_AMQP_CONTAINER: "true"
      PW_AWS_CONTAINER: "true"
      PW_AWS_S3_BUCKET: propmaster-examples
      PW_SEARCH_CONTAINER: "true"
      PW_INBOX_CONTAINER: "true"
      PW_MOCK_CONTAINER: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: ./.github/actions/npm-install
      - uses: ./.github/actions/test-history
        with:
          name: ${{ github.job }}-${{ matrix.db }}
      - name: Run integration tests against Testcontainers
        run: npx playwright test ${{ matrix.projects }}
      - uses: ./.github/actions/test-history
        if: always()
        with:
          save: true
          name: ${{ github.job }}-${{ matrix.db }}
      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-testcontainers-${{ matrix.db }}
          path: playwright-report/
          retention-days: 7

  test-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Browsers and their system libraries are preinstalled; keep the tag in step with
    # @playwright/test in package-lock.json. --user 1001 matches the runner's workspace owner.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      # The image's Node has no better-sqlite3 prebuild and no compiler; browser tests don't need it.
      - uses: ./.github/actions/npm-install
        with:
          ignore-scripts: "true"
      - uses: ./.github/actions/test-history
      - name: Run browser tests
        run: npx playwright test --project=browser-chromium --project=browser-firefox --project=browser-webkit --project=auth-browser
      - uses: ./.github/actions/test-history
        if: always()
        with:
          save: true
      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-browser
          path: playwright-report/
          retention-days: 7
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-browser
          path: test-results/
          retention-days: 7
