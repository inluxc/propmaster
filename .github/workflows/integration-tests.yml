name: Integration Tests

on:
  push:
    branches: [main]
    paths-ignore: &docs-only
      - "docs/**"
      - "README.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore: *docs-only

# A new push to a PR cancels that PR's older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SCARF_ANALYTICS: "false"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    container: node:24
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/npm-install
      - run: npm run typecheck
      - name: Check test conventions (TestCaseIDs, tags, steps, imports)
        run: npm run lint:tests
      - name: Check the browser job's Playwright image matches @playwright/test
        run: |
          v=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          grep -q "mcr.microsoft.com/playwright:v$v-" .github/workflows/integration-tests.yml \
            || { echo "::error::Bump the test-browser container image to v$v"; exit 1; }

  property-tests:
    runs-on: ubuntu-latest
    container: node:24
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/npm-install
      - run: npx playwright test --project=property-tests
      - run: npx playwright test --project=unit-tests

  test-postgres:
    runs-on: ubuntu-latest
    container: node:24
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 5s
          --health-timeout 30s
          --health-retries 5
    env:
      CI: true
      PW_DB_TYPE: postgresql
      PW_DB_HOST: postgres
      PW_DB_PORT: "5432"
      PW_DB_NAME: testdb
      PW_DB_USERNAME: testuser
      PW_DB_PASSWORD: testpass
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/npm-install
      - name: Validate environment variables
        run: bash .github/scripts/validate-env.sh PW_DB_TYPE PW_DB_HOST PW_DB_PORT PW_DB_NAME PW_DB_USERNAME PW_DB_PASSWORD
      - name: Create test schema
        run: node .github/scripts/create-test-schema.js
      - name: Run PostgreSQL integration tests
        run: npx playwright test --project=integration-database
      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-postgres
          path: playwright-report/
          retention-days: 7
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-postgres
          path: test-results/
          retention-days: 7

  test-mysql:
    runs-on: ubuntu-latest
    container: node:24
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: testdb
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 30s
          --health-retries 5
    env:
      CI: true
      PW_DB_TYPE: mysql
      PW_DB_HOST: mysql
      PW_DB_PORT: "3306"
      PW_DB_NAME: testdb
      PW_DB_USERNAME: testuser
      PW_DB_PASSWORD: testpass
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/npm-install
      - name: Validate environment variables
        run: bash .github/scripts/validate-env.sh PW_DB_TYPE PW_DB_HOST PW_DB_PORT PW_DB_NAME PW_DB_USERNAME PW_DB_PASSWORD
      - name: Create test schema
        run: node .github/scripts/create-test-schema.js
      - name: Run MySQL integration tests
        run: npx playwright test --project=integration-database
      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-mysql
          path: playwright-report/
          retention-days: 7
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-mysql
          path: test-results/
          retention-days: 7

  test-mssql:
    runs-on: ubuntu-latest
    container: node:24
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "TestPass123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P TestPass123! -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 60s
          --health-retries 6
    env:
      CI: true
      PW_DB_TYPE: mssql
      PW_DB_HOST: mssql
      PW_DB_PORT: "1433"
      PW_DB_NAME: master
      PW_DB_USERNAME: sa
      PW_DB_PASSWORD: "TestPass123!"
      PW_DB_ENCRYPT: "false"
      PW_DB_TRUST_SERVER_CERTIFICATE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/npm-install
      - name: Validate environment variables
        run: bash .github/scripts/validate-env.sh PW_DB_TYPE PW_DB_HOST PW_DB_PORT PW_DB_NAME PW_DB_USERNAME PW_DB_PASSWORD
      - name: Create test schema
        run: node .github/scripts/create-test-schema.js
      - name: Run MSSQL integration tests
        run: npx playwright test --project=integration-database
      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-mssql
          path: playwright-report/
          retention-days: 7
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-mssql
          path: test-results/
          retention-days: 7

  test-sqlite:
    runs-on: ubuntu-latest
    container: node:24
    env:
      CI: true
      PW_DB_TYPE: sqlite
      PW_DB_NAME: ${{ github.workspace }}/tmp/test.db
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/npm-install
      - name: Create SQLite database with schema
        run: |
          mkdir -p tmp
          node .github/scripts/create-test-schema.js
      - name: Run SQLite integration tests
        run: npx playwright test --project=integration-database
      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-sqlite
          path: playwright-report/
          retention-days: 7
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-sqlite
          path: test-results/
          retention-days: 7

  test-redis:
    runs-on: ubuntu-latest
    container: node:24
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 30s
          --health-retries 5
    env:
      CI: true
      PW_REDIS_HOST: redis
      PW_REDIS_PORT: "6379"
      PW_REDIS_KEY_PREFIX: "test:ci-${{ github.run_id }}:"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/npm-install
      - name: Validate environment variables
        run: bash .github/scripts/validate-env.sh PW_REDIS_HOST PW_REDIS_PORT PW_REDIS_KEY_PREFIX
      - name: Run Redis integration tests
        run: npx playwright test --project=integration-redis
      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-redis
          path: playwright-report/
          retention-days: 7
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-redis
          path: test-results/
          retention-days: 7

  test-neo4j:
    runs-on: ubuntu-latest
    container: node:24
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
          --health-interval 10s
          --health-timeout 60s
          --health-retries 10
    env:
      CI: true
      PW_NEO4J_URI: bolt://neo4j:7687
      PW_NEO4J_USERNAME: neo4j
      PW_NEO4J_PASSWORD: testpassword
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/npm-install
      - name: Validate environment variables
        run: bash .github/scripts/validate-env.sh PW_NEO4J_URI PW_NEO4J_USERNAME PW_NEO4J_PASSWORD
      - name: Run Neo4j integration tests
        run: npx playwright test --project=integration-neo4j
      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-neo4j
          path: playwright-report/
          retention-days: 7
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-neo4j
          path: test-results/
          retention-days: 7

  test-kafka:
    runs-on: ubuntu-latest
    container: node:24
    services:
      kafka:
        image: apache/kafka:latest
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          KAFKA_NUM_PARTITIONS: 1
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 60s
          --health-retries 6
    env:
      CI: true
      PW_KAFKA_BROKERS: kafka:9092
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/npm-install
      - name: Validate environment variables
        run: bash .github/scripts/validate-env.sh PW_KAFKA_BROKERS
      - name: Run Kafka integration tests
        run: npx playwright test --project=integration-kafka
      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-kafka
          path: playwright-report/
          retention-days: 7
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-kafka
          path: test-results/
          retention-days: 7

  test-openapi:
    runs-on: ubuntu-latest
    container: node:24
    env:
      CI: true
      PW_OPENAPI_SPEC_PATH: https://petstore.swagger.io/v2/swagger.json
      PW_OPENAPI_BASE_URL: http://localhost:4010
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/npm-install
      - name: Download OpenAPI spec locally
        run: curl -s https://petstore.swagger.io/v2/swagger.json -o /tmp/petstore-spec.json
      - name: Start Prism mock server
        run: |
          npx prism mock /tmp/petstore-spec.json --port 4010 --host 0.0.0.0 --errors false &
          echo "Prism PID: $!"
      - name: Wait for mock server
        run: |
          for i in $(seq 1 60); do
            if bash -c 'echo > /dev/tcp/localhost/4010' 2>/dev/null; then
              echo "Mock server is ready (port 4010 open)"
              sleep 2
              exit 0
            fi
            echo "Waiting for mock server... ($i/60)"
            sleep 2
          done
          echo "Mock server failed to start within 120 seconds"
          exit 1
      - name: Run OpenAPI integration tests
        run: npx playwright test --project=openapi
      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-openapi
          path: playwright-report/
          retention-days: 7
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-openapi
          path: test-results/
          retention-days: 7

  test-browser:
    runs-on: ubuntu-latest
    # Browsers and their system libraries are preinstalled; keep the tag in step with
    # @playwright/test in package-lock.json. --user 1001 matches the runner's workspace owner.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      # The image's Node has no better-sqlite3 prebuild and no compiler; browser tests don't need it.
      - uses: ./.github/actions/npm-install
        with:
          ignore-scripts: "true"
      - name: Run browser tests
        run: npx playwright test --project=browser-chromium --project=browser-firefox --project=browser-webkit
      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-browser
          path: playwright-report/
          retention-days: 7
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-browser
          path: test-results/
          retention-days: 7
