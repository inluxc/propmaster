        with:
          save: true
      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-mysql
          path: playwright-report/
          retention-days: 7
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-mysql
          path: test-results/
          retention-days: 7

  test-mssql:
